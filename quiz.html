<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz da Engenharia</title>
  
  <!-- Estilos Globais -->
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Logos Institucionais Fixas -->
  <img src="img/logo-capital.png" alt="Unigran Capital" class="logo-unigran">
  <img src="img/engenharia_logo.png" alt="Engenharia de Software" class="logo-engenharia">

  <!-- Container Interativo do Quiz Vocacional -->
  <div class="quiz-container">
    <h1 id="quizTitulo">Pergunta:</h1>
    <p id="quizTexto" class="quiz-question"></p>
    <div id="quizOpcoes"></div>
    <p id="contador">Escolha a opção que mais tem a ver com você!</p>
  </div>

  <!-- Scripts de Lógica de Áudio e Perguntas do Quiz -->
  <script src="js/audio.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
