<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Eng. Software</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Logo Unigran Capital (superior esquerdo) -->
  <img src="img/logo-capital.png" 
       alt="Unigran Capital" class="logo-unigran">

  <!-- Logo Engenharia de Software (inferior direito) -->
  <img src="img/engenharia_logo.png" 
       alt="Engenharia de Software" class="logo-engenharia">

    <div class="game-area">
        <h1 id="faseTitulo">Fase 1</h1>
        <canvas id="gameCanvas"></canvas>
        <div class="game-info">
          <p>Mova com ← →, pule com ↑. Chegue à porta para avançar de fase e responder ao quiz!</p>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentLevel = parseInt(urlParams.get("fase")) || 1;
        document.getElementById("faseTitulo").innerText = `Fase ${currentLevel}`;
        document.title = `Fase ${currentLevel} - Jogo Eng. Software`;
    </script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
