<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado Final - Jogo Eng. Software</title>
  
  <!-- Estilos Globais -->
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Canvas de Animação de Fogos de Artifício (Fundo) -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Container Principal da Tela de Resultado -->
  <div class="resultado-container">
    <!-- Imagem Lateral Esquerda -->
    <div class="side-col">
      <img src="img/left.png" alt="Ilustração Estudante" class="side-image">
    </div>

    <!-- Card Central de Resultado Vocacional -->
    <div class="resultado-card">
      <div class="resultado">
          <h1>Parabéns!</h1>
          <p>Sua vocação na Engenharia de Software será:</p>
          <h2 id="vocacaoResultado">...</h2>
          <p>Você provou sua habilidade no jogo. Que tal usar isso na vida real? Torne-se Engenheiro de Software!</p>
          <a href="index.html" class="restart-button">Jogar Novamente</a>
      </div>
    </div>

    <!-- Imagem Lateral Direita -->
    <div class="side-col">
      <img src="img/right.png" alt="Ilustração Estudante" class="side-image">
    </div>
  </div>

  <!-- Scripts de Áudio, Animação de Fogos e Cálculo de Resultado -->
  <script src="js/audio.js"></script>
  <script src="js/fireworks.js"></script>
  <script src="js/resultado.js"></script>
</body>
</html>
